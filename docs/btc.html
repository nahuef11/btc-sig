<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000">
<link rel="manifest" href="feed.webmanifest"><meta name="application-name" content="Feed"><meta name="apple-mobile-web-app-title" content="Feed"><link rel="icon" type="image/svg+xml" href="feed.svg"><link rel="icon" type="image/png" href="feed-192.png"><link rel="apple-touch-icon" href="feed-apple.png">
<title>Feed</title>
<style>

:root{color-scheme:only light;--onc:#fff;--bg:#fff;--tx:#0f1419;--mut:#536471;--bd:#eff3f4;--acc:#1d9bf0;--buy:#00ba7c;--sell:#f4212e;--wait:#d9a400}
@media (prefers-color-scheme:dark){:root{--onc:#000;--bg:#000;--tx:#e7e9ea;--mut:#71767b;--bd:#2f3336;--buy:#00d68f;--sell:#ff5a65;--wait:#f5c542}}
:root[data-theme="dark"]{--onc:#000;--bg:#000;--tx:#e7e9ea;--mut:#71767b;--bd:#2f3336;--buy:#00d68f;--sell:#ff5a65;--wait:#f5c542}
:root[data-theme="light"]{--onc:#fff;--bg:#fff;--tx:#0f1419;--mut:#536471;--bd:#eff3f4;--buy:#00ba7c;--sell:#f4212e;--wait:#d9a400}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:600px;margin-inline:auto;min-height:100vh;border-inline:1px solid var(--bd)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.top b{font-size:20px}.top b i{color:#f7931a;font-style:normal}
#rf{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;cursor:pointer}
.pulse{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--mut)}
.chip b{color:var(--tx)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:12px 16px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
.tw{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.av{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.bd{min-width:0;flex:1}
.hd{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd b{color:var(--tx)}
.tx{margin:2px 0 6px;overflow-wrap:anywhere}
.tags{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}.tags span{color:var(--acc)}
.tags em{font-style:normal;color:var(--mut)}
.bg{display:inline-block;border-radius:6px;padding:1px 8px;font-weight:700;font-size:13px;color:var(--onc);margin-right:6px}
a.go{color:var(--mut);font-size:13px;text-decoration:none}
.det{color:var(--mut);font-size:13px}
#st{padding:30px 16px;text-align:center;color:var(--mut)}
.sim{padding:12px 16px;border-bottom:1px solid var(--bd)}.sim h4{margin:0 0 6px;font-size:15px}.ch{width:100%;height:auto;display:block}.sim p{margin:4px 0;font-size:13px;color:var(--mut)}.sim b{font-size:14px}.sim small{font-size:12px;color:var(--mut)}
#fw{height:50dvh;overflow-y:auto;border-top:1px solid var(--bd)}
.fh{padding:8px 16px;font-weight:700;font-size:14px;color:var(--mut)}
#fw .tw{padding:8px 12px;gap:10px}#fw .av{flex:0 0 32px;height:32px;font-size:13px}
#fw .tx{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:1px 0 4px}
#fw .hd,#fw .tags{font-size:12px}
.dh{padding:14px 16px 4px;font-weight:700;text-transform:capitalize}
.sr{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--bd);font-size:14px}
.sr .t{color:var(--mut);width:44px}.sr .p{margin-left:auto;text-align:right}
.sum{padding:10px 16px;background:color-mix(in srgb,var(--mut) 12%,transparent);border-bottom:1px solid var(--bd);font-size:14px}
.empty{padding:30px 16px;text-align:center;color:var(--mut)}
.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}.cmp td,.cmp th{padding:4px 2px;text-align:right;border-bottom:1px solid var(--bd)}.cmp td:first-child,.cmp th:first-child{text-align:left}

.blk{padding:12px 16px;border-bottom:1px solid var(--bd)}
.blk h4{margin:0 0 6px;font-size:15px}
.chp{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:4px 10px;margin:0 6px 6px 0;font:inherit;font-size:13px;color:var(--mut);background:none;cursor:pointer}
.chp.on{color:var(--tx);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.cl{font-size:12px;color:var(--mut);margin:2px 0 4px}
.cw{padding:0 0 8px}canvas{display:block;width:100%;touch-action:none;-webkit-user-select:none;user-select:none}
.oh{font-size:12px;color:var(--mut);padding:2px 12px 6px 16px;min-height:28px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.zb{white-space:nowrap}.zb button{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:6px;width:30px;height:26px;margin-left:4px;font:inherit;cursor:pointer}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 4px}.bar i{display:block}
.fgb{height:12px;border-radius:6px;background:linear-gradient(90deg,#ea3943,#ea8c00,#f3d42f,#93d900,#16c784);position:relative;margin:10px 0 4px}
.fgb i{position:absolute;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:3px solid var(--tx);transform:translateX(-50%)}
.fgl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.fgh{display:flex;justify-content:space-between;align-items:baseline}
.sgh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.sgt{font-size:14px;color:var(--mut)}
.big{font-size:26px;font-weight:800}.rec{margin:6px 0 2px;font-size:14px}
.chev{color:var(--mut);width:14px;text-align:center}
.tb{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border-bottom:1px solid var(--bd)}
.tb>.chp{margin:0;padding:3px 10px;font-size:12px}
.pop{position:absolute;top:calc(100% + 4px);z-index:30;padding:10px 10px 4px;max-width:calc(100% - 24px);max-height:60vh;overflow:auto;border:1px solid var(--bd);border-radius:12px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#tfp{left:12px}#ip{right:12px}#c1{display:flex;flex-wrap:wrap;max-width:230px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}.dsum{font-weight:400;font-size:13px;color:var(--mut);text-transform:none}
.bg{white-space:nowrap}.xp,.sgt{white-space:pre-line}
.rt{white-space:pre-line;font-size:14px;margin-top:6px;line-height:1.5}
.xp{padding:6px 16px 10px;border-bottom:1px solid var(--bd)}
#newsv #fw{height:auto;overflow:visible;border-top:0}
.top b.lg{display:flex;align-items:center;gap:8px}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString("es-ES",{maximumFractionDigits:0});
const pc=x=>(x>=0?"+":"")+x.toFixed(1).replace(".",",")+"%";
const lab=a=>a==="COMPRAR"?"COMPRAR · LONG":a;
const bgs=(e,a)=>{e.style.background=colr(a);if(a==="ESPERAR")e.style.color="#111"};
const colr=a=>a==="COMPRAR"?"var(--buy)":a==="VENDER"?"var(--sell)":"var(--wait)";
let RP=null,D=null,S=null,LIVE=null,LIVEP=null,CD={},CV=null,VIEW="chart",HL=null,VO=0,RAF=0,HIST={},BK=null,BKT=null,LQWS=null,LQ=[],WS=null,WSOK=false,WSN=0,DT=0;
let CFG={tf:"1h",n:100,ind:["sma20","vol","sig"],theme:"dark"};

/* zoom y desplazamiento: arrastrar = viajar en el tiempo, pellizcar o rueda = zoom */
const PT=new Map();let G=null;
const redraw=()=>{if(!RAF)RAF=requestAnimationFrame(()=>{RAF=0;drawChart()})};
const clampView=()=>{const n=(CD[CFG.tf]||[]).length;CFG.n=Math.max(20,Math.min(300,Math.round(CFG.n)));VO=Math.max(0,Math.min(VO,Math.max(0,n-20)))};
const zoom=f=>{CFG.n=CFG.n*f;clampView();save();redraw()};
const pdist=()=>{const p=[...PT.values()];return p.length<2?0:Math.abs(p[0].x-p[1].x)};
function tapInfo(e){if(!CV)return;const r=$("cv").getBoundingClientRect(),i=Math.floor(CV.N-(CV.L+CV.pw-(e.clientX-r.left))/CV.st);if(i>=0&&i<CV.N){HL=i;info(i)}}
function bindChart(){
  const cv=$("cv");
  cv.addEventListener("pointerdown",e=>{PT.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,m:null});try{cv.setPointerCapture(e.pointerId)}catch(_){}G={n0:CFG.n,d0:pdist()};tapInfo(e)});
  cv.addEventListener("pointermove",e=>{
    const p=PT.get(e.pointerId);if(!p){tapInfo(e);return}
    if(PT.size===1){
      if(!p.m&&(Math.abs(e.clientX-p.x0)>6||Math.abs(e.clientY-p.y0)>6))p.m=Math.abs(e.clientY-p.y0)>Math.abs(e.clientX-p.x0)?"v":"h";
      if(p.m==="v"){window.scrollBy(0,p.y-e.clientY);p.y=e.clientY;return}
      const dx=e.clientX-p.x;p.x=e.clientX;p.y=e.clientY;if(p.m==="h"&&dx&&CV){VO+=dx/CV.st;HL=null;clampView();redraw()}
    }
    else{p.x=e.clientX;const d=pdist();if(G&&G.d0>8&&d>8){CFG.n=G.n0*G.d0/d;clampView();redraw()}}
  });
  const up=e=>{PT.delete(e.pointerId);if(!PT.size){save();setTimeout(()=>{HL=null},4000)}else G={n0:CFG.n,d0:pdist()}};
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",e=>{e.preventDefault();if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&CV){VO+=-e.deltaX/CV.st;clampView();redraw()}else zoom(e.deltaY>0?1.15:1/1.15)},{passive:false});
  $("zo").onclick=()=>zoom(1.3);$("zi").onclick=()=>zoom(1/1.3);$("zn").onclick=()=>{VO=0;redraw()};
}
/* zonas de liquidación estimadas: donde se acumulan liquidaciones de largos (pisos) y de cortos (techos) */
let LZ=null,LZT=0,LZB=false;
const lzOn=()=>CFG.ind.includes("lz");
function lzModel(oi,kl){
  const C=kl.map(r=>({t:r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4],v:+r[5]})),n=C.length,om={};
  for(const r of oi)om[Math.round(r.timestamp/36e5)]=+r.sumOpenInterestValue;
  const g=t=>{const k=Math.round(t/36e5);return om[k]??om[k+1]??om[k-1]??null},val=C.map(c=>g(c.t)),price=C[n-1].c,bs=price*.002,minL=[],maxH=[];
  let mn=Infinity,mx=-Infinity;for(let i=n-1;i>=0;i--){minL[i]=mn;maxH[i]=mx;mn=Math.min(mn,C[i].l);mx=Math.max(mx,C[i].h)}
  const TIERS=[[5,.1],[10,.3],[25,.3],[50,.2],[100,.1]],B={};let usedOI=0;
  for(let i=1;i<n;i++){
    const c=C[i],hasOI=val[i]!=null&&val[i-1]!=null,d=hasOI?val[i]-val[i-1]:c.v*c.c*.05;if(hasOI)usedOI++;if(d<=0)continue;
    const e=(c.o+c.c)/2,ls=Math.max(.25,Math.min(.75,.5+(c.c-c.o)/((c.h-c.l)||1)*.25));
    for(const[lev,wt]of TIERS){
      const LL=e*(1-1/lev+.005),SS=e*(1+1/lev-.005);
      if(minL[i]>LL){const k=Math.floor(LL/bs);(B[k]=B[k]||{l:0,s:0}).l+=d*ls*wt}
      if(maxH[i]<SS){const k=Math.floor(SS/bs);(B[k]=B[k]||{l:0,s:0}).s+=d*(1-ls)*wt}
    }
  }
  const ks=Object.keys(B).map(Number).sort((a,b)=>a-b),sm=k=>[-1,0,1].reduce((s,d)=>s+((B[k+d]||{l:0,s:0}).l+(B[k+d]||{l:0,s:0}).s),0);
  const pick=(side)=>{const c=ks.filter(k=>side==="s"?(k+1)*bs>price:(k+1)*bs<price).map(k=>({k,v:sm(k)})).sort((a,b)=>b.v-a.v),o=[];for(const x of c){if(o.every(y=>Math.abs(y.k-x.k)>=4))o.push(x);if(o.length>=2)break}return o.map(x=>({p:(x.k+.5)*bs,v:x.v,side}))};
  return{B,bs,price,oi:usedOI>n/2,zones:pick("s").concat(pick("l")),max:Math.max(...ks.map(k=>(B[k].l+B[k].s)),1)};
}
async function lzLoad(){

    LZ=lzModel(Array.isArray(oi)?oi:[],kl);LZT=Date.now();
  }catch(e){LZ=null}

}

/* libro de órdenes y liquidaciones */
const bookOn=()=>CFG.ind.includes("book");
async function bookFetch(){
  for(const u of ["https://api.kraken.com/0/public/Depth?pair=XBTUSD&count=500","https://api.exchange.coinbase.com/products/BTC-USD/book?level=2"]){
    try{
      const j=await(await fetch(u)).json();let b,a;
      if(j.result){const r=Object.values(j.result)[0];b=r.bids;a=r.asks}else{b=j.bids;a=j.asks}
      b=b.map(x=>[+x[0],+x[1]]);a=a.map(x=>[+x[0],+x[1]]);
      if(b.length&&a.length){BK={b,a};return}
    }catch(e){}
  }
  BK=null;
}
function bookRender(){
  const box=$("bk");box.hidden=!bookOn();if(!bookOn())return;box.textContent="";

  if(BK){
    const mid=(BK.b[0][0]+BK.a[0][0])/2,span=Math.min(mid-BK.b[BK.b.length-1][0],BK.a[BK.a.length-1][0]-mid);
    const bv=BK.b.filter(x=>x[0]>=mid-span).reduce((s,x)=>s+x[1],0),av=BK.a.filter(x=>x[0]<=mid+span).reduce((s,x)=>s+x[1],0),r=bv/((bv+av)||1);
    const bar=el("div","bar"),i1=el("i"),i2=el("i");i1.style.cssText="width:"+(r*100)+"%;background:var(--buy)";i2.style.cssText="width:"+((1-r)*100)+"%;background:var(--sell)";bar.append(i1,i2);box.appendChild(bar);
    box.appendChild(el("div","det","Compradores "+bv.toFixed(1)+" BTC · Vendedores "+av.toFixed(1)+" BTC, dentro de ±$"+fmt(span)+" del precio. Diferencia entre compra y venta: $"+(BK.a[0][0]-BK.b[0][0]).toFixed(1)+"."));
    box.appendChild(el("div","det",r>.58?"Hay más liquidez de compra cerca del precio: presión compradora a muy corto plazo.":r<.42?"Hay más liquidez de venta cerca del precio: presión vendedora a muy corto plazo.":"El libro está equilibrado cerca del precio."));
  }else box.appendChild(el("div","det","No se pudo leer el libro de órdenes desde tu navegador ahora mismo."));

  for(const x of lg.slice(-3).reverse())box.appendChild(el("div","det",new Date(x.t).toLocaleTimeString("es-ES")+" · "+(x.side==="SELL"?"largo":"corto")+" liquidado · "+m(x.usd)+" a "+fmt(x.p)));
}

function tick(p){

  const tf=CFG.tf,c=a[a.length-1],t=Date.now(),dur=candleMs(tf,c.t);
